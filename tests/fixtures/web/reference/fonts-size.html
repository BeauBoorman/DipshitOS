<html><head><title>Font size and weight resolution</title><style>
body { font-family:Inter,sans-serif; font-size:13px; line-height:18px; }
.em { font-size:2em; line-height:normal; }
.nest { font-size:1.5em; line-height:normal; }
.half { font-size:0.85em; }
.rem { font-size:1.5rem; line-height:normal; }
.larger { font-size:larger; line-height:normal; }
.smaller { font-size:smaller; }
.kw-small { font-size:small; }
.kw-xl { font-size:x-large; line-height:normal; }
.w200 { font-weight:200; }
.w600 { font-weight:600; }
.w900 { font-weight:900; }
</style></head><body>
<p>Body at 13 px.</p>
<p class="em">Two em text.</p>
<div class="nest">Outer nest.<div class="nest">Inner.</div></div>
<p class="half">Sub-em size.</p>
<p class="rem">Root em size.</p>
<p class="larger">Larger step.</p>
<p class="smaller">Smaller step.</p>
<p class="kw-small">Small twelve.</p>
<p class="kw-xl">XL twenty.</p>
<p class="w200">Weight 200.</p>
<p class="w600">Weight 600.</p>
<p class="w900">Weight 900.</p>
</body></html>
