# Docs publication gate.
#
# Runs the Boris prepublication validation against the public site/ tree on
# every push and pull request, so broken links, content-local asset errors, or
# URLs that escape the declared origin/base path fail before merge. The gate
# uses the same pipeline as the Pages build: the same pinned Boris revision
# (single source of truth in .github/boris-pin.json, shared with
# .github/workflows/github-pages.yml), the same project-site location
# (/VirelaiOS), the same theme, and the same profile/plan normalization.
#
# `boris validate` runs the same prepublication path as `boris compile`
# without writing artifacts, so this job leaves the working tree clean and
# adds no CI-side output beyond the plan check below.
#
# The project-site location is the canonical /VirelaiOS shape for this
# repository. Update these flags together with
# publication-profile.example.json if the site shape ever changes.

name: Docs gate

on:
  push:
  pull_request:

concurrency:
  group: docs-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate site publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      # Content-truth guard (M75c, issue #1672). Two checks, one design
      # choice: forbid lying FORWARD, never enforce freshness — a page that
      # lags behind the ledger is honest, so this never reds an unrelated
      # PR for staleness (M75a's sweep owns backward drift).
      #
      #   1. Deleted-binary denylist (site/** + README.md): a .BIN that
      #      build.zig no longer outputs may be named on a public surface
      #      only on a line carrying a historical marker. docs/ is
      #      deliberately exempt: ADRs and march trackers quote old
      #      binaries AS history.
      #   1b. Stale gate-script names (site/** + README.md): the
      #      verify-live-* scripts no longer exist (gates are specs under
      #      tools/gate/specs/ run by `just gate <id>`), so naming one as
      #      current is a forward lie. docs/testing.md's dated history
      #      entries stay exempt for the same reason as (1).
      #   2. Never-lie-forward watermark: no page under site/, README.md, or
      #      docs/ (minus docs/archive/, the generated
      #      gate-fleet-inventory.md,
      #      and docs/status.md — the source) may claim an M-number higher
      #      than docs/status.md contains. README may name an M-number only
      #      once status.md carries it — link the issue until then.
      - name: Site truth guard (deleted binaries + milestone watermark)
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          root = pathlib.Path(".")
          fails = []

          # 1) denylist: the built .BIN set is derived from build.zig itself
          built = set(
              re.findall(r'"([A-Z][A-Z0-9_]{0,24})\.BIN"', (root / "build.zig").read_text())
          )
          marker = re.compile(r"retired|deleted|\bnow\b|\bwas\b|successor", re.I)
          bin_re = re.compile(r"\b([A-Z][A-Z0-9_]{1,24})\.BIN\b")
          stale_re = re.compile(r"\bverify-live-[a-z0-9-]+")
          public = sorted((root / "site").rglob("*.md")) + [root / "README.md"]
          for path in public:
              if not path.exists():
                  continue
              for lineno, line in enumerate(path.read_text().splitlines(), 1):
                  for name in bin_re.findall(line):
                      if name in built or marker.search(line):
                          continue
                      fails.append(
                          f"{path}:{lineno}: names deleted {name}.BIN with no marker "
                          "(retired|deleted|now|was|successor)"
                      )
                  for stale in stale_re.findall(line):
                      fails.append(
                          f"{path}:{lineno}: names {stale} — no such script; "
                          "gates are specs (just gate <id>)"
                      )

          # 2) watermark: max M-token in status.md bounds every other page
          status = (root / "docs" / "status.md").read_text()
          limit = max(int(m) for m in re.findall(r"\bM(\d{1,3})", status))
          skip = {"status.md", "gate-fleet-inventory.md"}
          for base in (root / "site", root / "docs", root / "README.md"):
              paths = sorted(base.rglob("*.md")) if base.is_dir() else [base]
              for path in paths:
                  rel = path.relative_to(root)
                  if path.name in skip or "archive" in rel.parts:
                      continue
                  for lineno, line in enumerate(path.read_text().splitlines(), 1):
                      for token in re.findall(r"\bM(\d{1,3})", line):
                          if int(token) > limit:
                              fails.append(
                                  f"{path}:{lineno}: claims M{token} but docs/status.md stops at M{limit}"
                              )

          if fails:
              print("\n".join(fails))
              sys.exit(1)
          print(f"truth guard ok: {len(built)} built .BIN names, milestone watermark M{limit}")
          PY

      # The Boris revision is the single pin in .github/boris-pin.json,
      # shared with the Pages publish workflow: this gate always validates
      # the same toolchain that publishes.
      - name: Resolve Boris toolchain pin
        id: boris-pin
        run: echo "revision=$(jq -r .revision .github/boris-pin.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Boris toolchain
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: drawmeanelephant/boris
          ref: ${{ steps.boris-pin.outputs.revision }}
          path: boris
          fetch-depth: 1

      - name: Install Zig
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: 0.17.0

      - name: Build Boris
        run: cd boris && zig build -Doptimize=ReleaseSafe

      # Cheap schema-drift guard: the starter profile must still plan to
      # the /VirelaiOS project-site shape the gate and the publish workflow
      # hard-code.
      - name: Validate the starter publication profile
        run: |
          boris/zig-out/bin/boris plan --profile publication-profile.example.json > /tmp/publication-plan.json
          test "$(jq -r '.publication.site_kind' /tmp/publication-plan.json)" = "project-site"
          test "$(jq -r '.publication.base_path' /tmp/publication-plan.json)" = "/VirelaiOS"

      # The same prepublication checks as the Pages build, without writing
      # dist/. Fails on EPUBLICATIONLOCATION (URL escapes the declared
      # origin/base path), EASSET, ECOMPONENT, and any other compiler
      # finding that would fail the publish workflow.
      - name: Validate site against the project-site location
        run: |
          boris/zig-out/bin/boris validate \
            --input site \
            --target public=dist \
            --target-layout public=themes/virelaios/layouts/main.html \
            --sitemap \
            --pages-base-url https://drawmeanelephant.github.io/VirelaiOS \
            --pages-origin https://drawmeanelephant.github.io \
            --pages-base-path /VirelaiOS \
            --site-url https://drawmeanelephant.github.io/VirelaiOS
